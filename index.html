<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ex Libris</title>
  <meta name="description" content="Minha biblioteca pessoal: estante, resumos, calendário de leitura e recomendações.">
  <meta name="theme-color" content="#2a1a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Ex Libris">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#estante" aria-label="Ex Libris, ir para a estante">
        <svg class="seal" viewBox="0 0 64 64" aria-hidden="true">
          <path d="M32 3c4 3 7 1 10 4s2 6 6 8 6 3 6 8-3 5-2 9 3 6 0 10-6 3-8 6-3 7-8 7-6-3-9-3-6 3-10 1-3-6-6-8-6-3-6-8 3-6 2-10-3-6 0-10 6-3 8-6 3-6 9-6 4 0 8-2z" fill="currentColor"/>
          <circle cx="32" cy="32" r="19" fill="none" stroke="#f3dfae" stroke-width="1.4" opacity=".7"/>
          <text x="32" y="38.5" text-anchor="middle" font-family="IM Fell English, Georgia, serif" font-size="18" font-style="italic" fill="#f3dfae" stroke="none">EL</text>
        </svg>
        <span class="brand-text">
          <span class="brand-name">Ex Libris</span>
          <span class="brand-sub" id="brand-sub">biblioteca particular</span>
        </span>
      </a>
      <div class="topbar-actions">
        <span id="sync-chip" class="sync-chip" hidden></span>
        <button class="btn btn-gold" data-action="add-book" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>Catalogar livro</span>
        </button>
      </div>
    </div>
    <nav class="tabs" aria-label="Seções">
      <a href="#estante" data-view="estante">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h3v16H4zM9 6h3v14H9zM14.5 5.2l2.9-.8 3.6 14.6-2.9.8zM3 20.5h18"/></svg>
        <span>Estante</span>
      </a>
      <a href="#calendario" data-view="calendario">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v14H4zM4 10h16M8 3v5M16 3v5"/></svg>
        <span>Calendário</span>
      </a>
      <a href="#descobrir" data-view="descobrir">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
        <span>Descobrir</span>
      </a>
      <a href="#leitor" data-view="leitor">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20c0-4 3-6.5 7-6.5s7 2.5 7 6.5"/><circle cx="12" cy="8" r="4"/></svg>
        <span>Leitor</span>
      </a>
    </nav>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <div id="modal-root"></div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
